PACKAGE_NAME="ipu-bridge-gc2607"
PACKAGE_VERSION="1.0"

# DKMS copies the source tree to .../build and runs PRE_BUILD from there, so
# pre-build.sh is alongside us. It fetches + patches ipu-bridge.c for the
# kernel being built ($kernelver is exported by DKMS).
PRE_BUILD="pre-build.sh"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

BUILT_MODULE_NAME[0]="ipu-bridge"

# Land in updates/, which depmod prefers over the in-tree kernel/ copy. This
# is what lets us override a built-in distro module without touching it.
DEST_MODULE_LOCATION[0]="/updates"

AUTOINSTALL="yes"
