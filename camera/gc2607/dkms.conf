PACKAGE_NAME="gc2607"
PACKAGE_VERSION="1.0"

# Reuse the driver's own Makefile; it honours KDIR.
MAKE[0]="make KDIR=${kernel_source_dir}"
CLEAN="make KDIR=${kernel_source_dir} clean"

BUILT_MODULE_NAME[0]="gc2607"
DEST_MODULE_LOCATION[0]="/updates"

# Rebuild automatically on every kernel install/upgrade. This is the whole
# point of the package: without it the camera dies on the next kernel bump.
AUTOINSTALL="yes"
